name: Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - 'server/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_SERVICE: ${{ secrets.RAILWAY_SERVICE }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: ./server
        run: npm ci

      - name: Build (if using Vite build)
        working-directory: ./server
        run: npm run build:prod || echo "Build step optional"
        continue-on-error: true

      - name: Install Railway CLI
        if: ${{ env.RAILWAY_TOKEN != '' && env.RAILWAY_SERVICE != '' }}
        run: npm install -g @railway/cli

      - name: Deploy to Railway with CLI
        if: ${{ env.RAILWAY_TOKEN != '' && env.RAILWAY_SERVICE != '' }}
        working-directory: ./server
        run: railway up --service "$RAILWAY_SERVICE" --ci

      # Add other deployment steps for Render, Heroku, etc.
